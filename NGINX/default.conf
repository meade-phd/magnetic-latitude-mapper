server {
    listen       80;
    server_name  localhost;

    # 1. Set the correct, global root directory for the whole server
    root   /var/www/html;
    index  index.php index.html;

    location / {
        # Using try_files prevents NGINX from blindly passing broken requests to PHP
        try_files $uri /index.php?$query_string;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 2. Correctly pass PHP requests to the Model Server container
    location ~ \.php$ {
        fastcgi_pass   model-server:9000;
        fastcgi_index  index.php;
        
        # Load standard parameters
        include        fastcgi_params;
        
        # This tells PHP-FPM exactly where the file is on its own filesystem
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/$fastcgi_script_name;
    }
}
